Screens:
  Raised Alert:
    Properties:
      Fill: =RGBA(0, 81, 100, 1)
    Children:
      - Image3:
          Control: Image@2.2.3
          Properties:
            Height: =370
            Image: =alert
            Width: =445
            X: =104
            Y: =105
      - Text13:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Patrick Hand'
            Height: =111
            Size: =72
            Text: ="ALERT RAISED !"
            Width: =445
            X: =132
            Y: =36
      - Text13_1:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Patrick Hand'
            Height: =228
            Size: =72
            Text: ="VOLUNTEERS NEEDED !"
            Width: =627
            X: =13
            Y: =401
      - Button6:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(8, 222, 8, 1)
            Font: =Font.'Patrick Hand'
            Height: =169
            Size: =48
            Text: ="ACCEPT"
            Width: =285
            X: =34
            Y: =854
      - Button6_1:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(249, 83, 109, 1)
            Font: =Font.'Patrick Hand'
            Height: =169
            Size: =48
            Text: ="DECLINE"
            Width: =285
            X: =331
            Y: =854
      - Label9:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =90
            Size: =40
            Text: |-
              ="Beach: " & varBeach.Title
            Width: =476
            X: =34
            Y: =560
      - Label10:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Size: =40
            Text: |-
              ="Reason: " & LookUp(Beaches, 'Beach Names' = varBeach.Title, 'Alert Reason')
            X: =34
            Y: =650
      - Label11:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Size: =40
            Text: |-
              ="Volunteers Needed: " & Text(LookUp(Beaches, 'Beach Names' = varBeach.Title, 'Number Of Volunteers'))
            X: =46
            Y: =740
