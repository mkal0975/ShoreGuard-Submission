Screens:
  Volunteer - Final:
    Properties:
      Fill: =RGBA(0, 81, 100, 1)
    Children:
      - iconCircle1:
          Control: Circle@2.3.0
          Properties:
            X: =270
            Y: =363
      - iconCheck1:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(166, 215, 153, 1)
            Height: =226
            Icon: =Icon.Check
            PaddingBottom: =Self.PaddingTop
            PaddingLeft: =Self.PaddingTop
            PaddingRight: =Self.PaddingTop
            PaddingTop: =18
            PressedFill: =RGBA(255, 255, 255, 0.3)
            Width: =242
            X: =201
            Y: =300
      - LblSuccessMsg1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Semibold
            Height: =iconCircle1.Height
            Size: =48
            Text: ="Volunteering slot booked successfully !"
            Width: =Parent.Width * 0.75
            X: =Parent.Width/2 - Self.Width/2
            Y: =628
      - Text12:
          Control: ModernText@1.0.0
          Properties:
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Patrick Hand'
            Height: =160
            Size: =72
            Text: ="CONGRATULATIONS !"
            Width: =568
            X: =51
            Y: =87
