Screens:
  Volunteer-Page 2:
    Properties:
      Fill: =RGBA(0, 81, 100, 1)
      OnVisible: |-
        =Set(
            currentLifeguard,
            LookUp(LifeguardDetails, Email = User().Email)
        );
        Set(
            lifeguardBeaches,
            Split(currentLifeguard.'Selected Beaches', ",")
        );
        Set(selectedBeach, "");
        Set(selectedShift, "")
    Children:
      - Text10:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans Condensed'
            FontWeight: =FontWeight.Bold
            Height: =138
            Size: =48
            Text: |-
              ="Hi !
              It's A Beautiful Day To Be Out On The Beach"
            Width: =572
            X: =40
            Y: =116
      - Text11:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =72
            Text: ="Which Beach Are We Applying Today?"
            Width: =546
            X: =30
            Y: =359
      - Text10_5:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            AutoHeight: =true
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans Condensed'
            FontWeight: =FontWeight.Bold
            Height: =138
            Size: =48
            Text: ="Select A Time Slot"
            Width: =572
            X: =33
            Y: =603
      - Dropdown1:
          Control: Classic/DropDown@2.3.1
          Properties:
            ChevronBackground: =App.Theme.Colors.Lighter40
            Fill: =RGBA(174, 208, 221, 1)
            Items: |+
              =Split(
                  Trim(varVolunteer.'Selected Beaches'),
                  ","
              )
            Items.Value: =Value
            OnChange: =Set(varSelectedBeach, LookUp(BeachDetails, Title = Trim(Dropdown1.Selected.Value)))
            X: =30
            Y: =445
      - Dropdown2:
          Control: Classic/DropDown@2.3.1
          Properties:
            ChevronBackground: =App.Theme.Colors.Lighter40
            Fill: =RGBA(174, 208, 221, 1)
            Items: |-
              =ForAll(
                  Sequence(
                      DateDiff(
                          TimeValue(varSelectedBeach.Opens),
                          TimeValue(varSelectedBeach.Closes),
                          TimeUnit.Hours
                      ) / 2
                  ),
                  {
                      Slot:
                      Text(
                          DateAdd(
                              TimeValue(varSelectedBeach.Opens),
                              (Value - 1) * 2,
                              TimeUnit.Hours
                          ), "HH:mm"
                      )
                      & " - " &
                      Text(
                          DateAdd(
                              TimeValue(varSelectedBeach.Opens),
                              Value * 2,
                              TimeUnit.Hours
                          ), "HH:mm"
                      )
                  }
              )
            Items.Value: =Slot
            X: =38
            Y: =699
      - Button8:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(141, 229, 250, 1)
            OnSelect: |-
              =If(
                  IsBlank(Dropdown1.Selected.Value) Or IsBlank(Dropdown2.Selected.Slot),
                  Notify("Please select a beach and time slot", NotificationType.Error),
                  Patch(
                      LifeguardDetails,
                      LookUp(LifeguardDetails, ID = varVolunteer.ID),
                      {
                          'Beach Today': Trim(Dropdown1.Selected.Value),
                          SlotToday: Trim(Dropdown2.Selected.Slot)
                      }
                  );
                  Set(varVolunteer, LookUp(LifeguardDetails, Email = varVolunteer.Email));
                  Notify("Your beach and time slot have been saved!", NotificationType.Success);
                  Navigate('Volunteer-Page 3')
              )
            Text: ="SUBMIT"
            X: =177
            Y: =880
