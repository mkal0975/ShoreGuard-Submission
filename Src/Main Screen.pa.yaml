Screens:
  Main Screen:
    Properties:
      Fill: =RGBA(0, 81, 100, 1)
    Children:
      - Text1:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Courier New'
            FontWeight: =FontWeight.Bold
            Height: =109
            Size: =56
            Text: ="SHORE-GUARD"
            Width: =472
            X: =75
            Y: =49
      - Text2:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(214, 221, 224, 1)
            Font: =Font.'Courier New'
            Height: =74
            Text: ="Safe Shores Start With You"
            Width: =442
            X: =105
            Y: =108
      - Text3:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Lato Black'
            Height: =94
            Size: =48
            Text: ="Login"
            Width: =220
            X: =226
            Y: =286
      - Text4:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =62
            Size: =32
            Text: ="Email :"
            Width: =211
            X: =46
            Y: =408
      - Text4_1:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =62
            Size: =32
            Text: ="Password :"
            Width: =211
            X: =46
            Y: =571
      - Button1:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(141, 229, 250, 1)
            OnSelect: |+
              =Set(
                  varVolunteer,
                  LookUp(
                      LifeguardDetails,
                      Email = TextInput_Email.Text And Password = TextInput_Password.Text
                  )
              );

              If(
                  IsBlank(varVolunteer),
                  Notify("Invalid volunteer login", NotificationType.Error),
                  Navigate('Volunteer-Page 2')
              )
            Text: ="Volunteer"
            Width: =266
            X: =46
            Y: =770
      - Button:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =RGBA(141, 229, 250, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =58
            OnSelect: |-
              =Set(
                  varBeach,
                  LookUp(BeachDetails, Email = TextInput_Email.Text And Password = TextInput_Password.Text)
              );
              If(
                  IsBlank(varBeach),
                  Notify("Invalid beach facility login", NotificationType.Error),
                  Navigate('Beach-Page 2')
              )
            Text: ="Beach Facility"
            Width: =266
            X: =339
            Y: =773
      - Text5:
          Control: ModernText@1.0.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            Height: =68
            Text: ="Do not have an account yet?"
            Width: =406
            X: =63
            Y: =1011
      - Button2:
          Control: ModernButton@1.0.0
          Properties:
            Appearance: =ButtonAppearance.Transparent
            Color: =RGBA(255, 255, 255, 1)
            OnSelect: =Navigate('Create Account')
            Text: ="Sign up"
            Width: =137
            X: =410
            Y: =1015
      - TextInput_Email:
          Control: ModernTextInput@1.1.0
          Properties:
            BasePaletteColor: =RGBA(189, 178, 176, 1)
            Fill: =RGBA(174, 208, 221, 1)
            Placeholder: ="Enter Your Email"
            X: =46
            Y: =470
      - TextInput_Password:
          Control: ModernTextInput@1.1.0
          Properties:
            BasePaletteColor: =RGBA(141, 229, 250, 1)
            Fill: =RGBA(174, 208, 221, 1)
            Placeholder: ="Enter Your Password"
            Type: =TextInputType.Password
            X: =46
            Y: =633
